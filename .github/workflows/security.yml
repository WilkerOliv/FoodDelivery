name: Security checks

on:
  push:
  pull_request:
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

jobs:
  security-capabilities:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    outputs:
      codeql: ${{ steps.capabilities.outputs.codeql }}
    steps:
      - uses: actions/checkout@v4
      - name: Check available Code Scanning features
        id: capabilities
        env:
          GH_TOKEN: ${{ github.token }}
          CODEQL_ENABLED: ${{ vars.CODEQL_ENABLED }}
        run: python3 scripts/check_code_scanning.py

  semgrep:
    name: Free static security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Semgrep Community Edition
        run: python -m pip install --disable-pip-version-check semgrep==1.184.0
      - name: Scan application code and preview gateway
        run: >-
          semgrep scan --config p/security-audit --config p/secrets
          --metrics=off --disable-version-check --error --sarif
          --output semgrep.sarif
          Backend/src/main Frontend/src Frontend/scripts deploy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-security-report
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 30

  codeql:
    name: CodeQL · ${{ matrix.language }}
    needs: security-capabilities
    if: needs.security-capabilities.outputs.codeql == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Compile Java for CodeQL
        if: matrix.build-mode == 'manual'
        working-directory: Backend
        run: mvn --batch-mode --no-transfer-progress -DskipTests clean package
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    if: github.event_name == 'pull_request' && (github.event.repository.visibility == 'public' || vars.DEPENDENCY_REVIEW_ENABLED == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  backend-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate CycloneDX SBOM
        working-directory: Backend
        run: mvn --batch-mode org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/upload-artifact@v4
        with:
          name: backend-cyclonedx-sbom
          path: Backend/target/bom.json
          if-no-files-found: error
          retention-days: 30
