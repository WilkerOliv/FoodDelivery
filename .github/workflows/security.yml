name: Security checks

on:
  push:
  pull_request:
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

jobs:
  security-capabilities:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    outputs:
      codeql: ${{ steps.capabilities.outputs.codeql }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check available Code Scanning features
        id: capabilities
        env:
          GH_TOKEN: ${{ github.token }}
          CODEQL_ENABLED: ${{ vars.CODEQL_ENABLED }}
        run: python3 scripts/check_code_scanning.py

  semgrep:
    name: Free static security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Semgrep Community Edition
        run: python -m pip install --disable-pip-version-check semgrep==1.184.0
      - name: Scan application code and preview gateway
        run: >-
          semgrep scan --config p/security-audit --config p/secrets
          --metrics=off --disable-version-check --error --sarif
          --output semgrep.sarif
          Backend/src/main Frontend/src Frontend/scripts deploy
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: semgrep-security-report
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 30

  codeql:
    name: CodeQL · ${{ matrix.language }}
    needs: security-capabilities
    if: needs.security-capabilities.outputs.codeql == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Compile Java for CodeQL
        if: matrix.build-mode == 'manual'
        working-directory: Backend
        run: mvn --batch-mode --no-transfer-progress -DskipTests clean package
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    if: github.event_name == 'pull_request' && (github.event.repository.visibility == 'public' || vars.DEPENDENCY_REVIEW_ENABLED == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  backend-sbom:
    name: Backend dependency vulnerabilities and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate CycloneDX SBOM
        working-directory: Backend
        run: mvn --batch-mode org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - name: Scan resolved dependencies for known vulnerabilities
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.69.3
          scan-type: sbom
          scan-ref: Backend/target/bom.json
          format: json
          output: Backend/target/dependency-vulnerabilities.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-dependency-vulnerabilities
          path: Backend/target/dependency-vulnerabilities.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-cyclonedx-sbom
          path: Backend/target/bom.json
          if-no-files-found: error
          retention-days: 30
