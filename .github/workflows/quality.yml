name: Project quality

on:
  push:
  pull_request:

jobs:
  public-preview:
    name: Preview gateway and startup regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test protected gateway and slow startup
        run: python3 scripts/test_public_preview.py
      - name: Test backup failure handling
        run: python3 -m unittest scripts.test_backup_scripts
      - name: Install backup and workflow test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age jq python3-yaml
      - name: Test workflow pins and dependency update coverage
        run: /usr/bin/python3 -m unittest scripts.test_supply_chain
      - name: Test encrypted offsite backup and restore
        run: python3 -m unittest scripts.test_offsite_backup
      - name: Test detection of Code Scanning availability
        run: python3 -m unittest discover -s scripts -p test_security_capabilities.py
      - name: Test persistent deployment configuration
        run: python3 scripts/test_persistent_deploy.py

  persistent-container:
    name: Persistent container and verified TLS PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build the persistent deployment
        run: docker build -f deploy/Dockerfile.persistente -t fooddelivery-persistent:qa .
      - name: Test restart, database recovery and private web package
        run: python3 scripts/test_persistent_deploy.py --container

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests and migrations
        working-directory: Backend
        env:
          JWT_SECRET: 0123456789012345678901234567890123456789012345678901234567890123
        run: mvn --batch-mode test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        working-directory: Frontend
        run: npm run check
      - name: Run frontend tests
        working-directory: Frontend
        run: npm test

  postgres:
    name: PostgreSQL concurrency and restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test isolated PostgreSQL, simulator isolation and dump restore
        run: python3 scripts/test_postgres.py
