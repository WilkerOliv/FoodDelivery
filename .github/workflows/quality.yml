name: Project quality

on:
  push:
  pull_request:

jobs:
  public-preview:
    name: Preview gateway and startup regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test protected gateway and slow startup
        run: python3 scripts/test_public_preview.py
      - name: Test detection of Code Scanning availability
        run: python3 -m unittest discover -s scripts -p test_security_capabilities.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests and migrations
        working-directory: Backend
        env:
          JWT_SECRET: 0123456789012345678901234567890123456789012345678901234567890123
        run: mvn --batch-mode test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        working-directory: Frontend
        run: npm run check
      - name: Run frontend tests
        working-directory: Frontend
        run: npm test
