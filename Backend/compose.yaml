services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fooddelivery
      POSTGRES_USER: fooddelivery
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?configure DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - fooddelivery-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fooddelivery -d fooddelivery"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  fooddelivery-db:
