services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fooddelivery
      POSTGRES_USER: ${DATABASE_USERNAME:-fooddelivery_app}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?configure DATABASE_PASSWORD}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - fooddelivery-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  fooddelivery-db:
