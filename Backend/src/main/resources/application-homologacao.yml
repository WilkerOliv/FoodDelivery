# Activated only by the isolated launcher. No production environment file is read.
server:
  address: 127.0.0.1
  port: 8181
spring:
  datasource:
    url: jdbc:h2:file:./data/homologacao/database;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  flyway:
    locations: classpath:db/migration-common,classpath:db/migration-h2
  h2:
    console:
      enabled: false
app:
  private:
    encryption-key: ZmFrZS1kZW1vLWtleS1uZXZlci11c2UtaW4tcHJvZCE=
  demo:
    enabled: true
  web:
    allowed-origins: http://127.0.0.1:5180,http://localhost:5180
  security:
    cookie-secure: false
    cookie-name: fooddelivery_demo_session
  media:
    store-assets-dir: ./data/homologacao/store-assets
  recovery:
    whatsapp:
      enabled: false
  payment:
    mercadopago:
      client-id: ''
      client-secret: ''
      sandbox: true
      test-webhook-signature: false
