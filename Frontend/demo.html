<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mensagens de homologação</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/theme.css"><script src="/runtime-config.js"></script><script type="module" src="/src/demoInbox.js"></script></head>
<body><main class="panel demo-inbox"><h1>Caixa local de homologação</h1><p>E-mail e WhatsApp simulados. Códigos não são enviados à internet. Entre com a conta administrativa de demonstração.</p><form id="demo-login"><label>E-mail<input name="email" type="email" value="admin@example.test" required></label><label>Senha<input name="password" type="password" required autocomplete="current-password"></label><button class="btn" type="submit">Entrar e consultar mensagens</button></form><button class="btn outline" id="refresh" type="button">Atualizar mensagens</button><p id="status" role="status"></p><div id="messages"></div><a class="btn outline" href="/">Voltar ao site</a></main></body></html>
